# DESIGN TWEAKS
# https://tmuxcheatsheet.com/
# https://hamvocke.com/blog/a-guide-to-customizing-your-tmux-conf/

# -- general -------------------------------------------------------------------

set -g default-terminal "tmux-256color"
set -as terminal-features ',*:RGB'

set -s escape-time 10                     # faster command sequences
set -sg repeat-time 600                   # increase repeat timeout
set -s focus-events on

# Remap prefix from 'C-b' to 'C-a'
unbind C-b
set -g prefix C-j
bind C-j send-prefix

set -q -g status-utf8 on                  # expect UTF-8 (tmux < 2.2)

set -g history-limit 100000                 # boost history

# Reload config
bind r source-file ~/.config/tmux/tmux.conf


# -- display -------------------------------------------------------------------

set -g base-index 1           # start windows numbering at 1
setw -g pane-base-index 1     # make pane numbering consistent with windows

setw -g automatic-rename on   # rename window to reflect current program
set -g renumber-windows on    # renumber windows when a window is closed

set -g set-titles on          # set terminal title
set -g set-titles-string "#S:#I.#P — #W — #{pane_current_path}"

set -g display-panes-time 800 # slightly longer pane indicators display time
set -g display-time 1000      # slightly longer status messages display time

set -g status-interval 10     # redraw status line every 10 seconds

# clear both screen and history
bind -n C-l send-keys C-l \; run 'sleep 0.2' \; clear-history

# activity
set -g monitor-activity on
set -g visual-activity off

# Status bar
set -g status-position bottom
set -g status-justify left
# set -g status-left ''
set -g status-left-length 10

# Clock mode
# setw -g clock-mode-color yellow
set -g status-right-length 25
set -g status-right ' %I:%M-%p  %d-%b-%y '



# -- navigation ----------------------------------------------------------------

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

unbind '"'
unbind %
# split current window horizontally
bind _ split-window -v -c '#{pane_current_path}'
# split current window vertically
bind - split-window -h -c '#{pane_current_path}'

# Create a new window in current directory
bind c new-window -c '#{pane_current_path}'

# Quickly rename current window Ctrl+j ,
bind , command-prompt -I "#W" "rename-window '%%'"
# Quickly rename session Ctrl+j $
bind $ command-prompt -I "#S" "rename-session '%%'"

# Useful when administering servers: Ctrl+j S
bind S setw synchronize-panes

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# Use alt-arrow keys without perfix to switch panals
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D

# Shift arrow to switch window
bind -n S-Left previous-window
bind -n S-Right next-window

# maximize current pane
# bind + run "cut -c3- '#{TMUX_CONF}' | sh -s _maximize_pane '#{session_name}' '#D'"

# pane resizing
bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2

# window navigation
unbind n
unbind p
bind -r C-h previous-window                             # select previous window
bind -r C-l next-window                                 # select next window
bind -r C-S-H swap-window -t -1 \; select-window -t -1  # swap current window with the previous one
bind -r C-S-L swap-window -t +1 \; select-window -t +1  # swap current window with the next one
# bind Tab last-window                                    # move to last active window
# bind BTab switch-client -l                              # move to last session

# Enable mouse
set -g mouse on

# -- facebook pathpicker -------------------------------------------------------

bind F run "cut -c3- '#{TMUX_CONF}' | sh -s _fpp '#{pane_id}' '#{pane_current_path}'"


# -- copy mode -----------------------------------------------------------------

bind Enter copy-mode # enter copy mode
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line
bind -T copy-mode-vi $ send -X end-of-line

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"     # Press 'y' after selecting the text to copy

# -- buffers -------------------------------------------------------------------

bind b list-buffers     # list paste buffers
bind p paste-buffer -p  # paste from the top paste buffer
bind P choose-buffer    # choose which buffer to paste from

# -- colors -------------------------------------------------------------------
# set -g pane-border-style 'fg=red'
# set -g pane-active-border-style 'fg=yellow'

# set -g mode-style 'fg=white,bold,bg=red' # Copy mode styling

# Status bar
set -g status-style 'bg=black'

# Session name (left side)
set -g status-left '#[bg=blue,fg=black] #S #[default]'

# Inactive windows
setw -g window-status-style 'bg=colour238,fg=colour250,dim'
setw -g window-status-format ' #I #W '

# Active window
setw -g window-status-current-style 'bg=green,fg=white,bold'
setw -g window-status-current-format ' #I #W '

# Clock (right side)
set -g status-right '#[fg=black,bg=green] %I:%M-%p  %d-%b-%y #[default]'
