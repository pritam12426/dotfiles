theme = "ayu_evolve"

[editor]
	# lsp.enable = false # This turns off all LSP features for all languages
	scrolloff = 5
	# color = true
	auto-format = false
	line-number = "relative"
	bufferline = "multiple"

	[editor.cursor-shape]
		insert = "bar"
		select = "underline"

	[editor.indent-guides]
		render = true
		character = "┊" # Some characters that work well: "▏", "┆", "┊", "⸽"
		# skip-levels = 1

	[editor.whitespace]
		[editor.whitespace.render]
			space = "none"
			tab = "all"
			nbsp = "none"
			nnbsp = "none"
			newline = "all"

		[editor.whitespace.characters]
			space = "·"
			tab = "-"
			newline = "¬"
			# tabpad = "·"  # Tabs will look like "→···" (depending on tab width)

	[editor.lsp]
		display-inlay-hints = true
		enable = false

	[editor.auto-save]
		focus-lost = true

	[editor.statusline]
		left = ["mode", "spinner", "read-only-indicator"]
		center = ["file-name", "file-modification-indicator"]
		right = [
			"diagnostics",
			"selections",
			"position",
			"file-encoding",
			"file-line-ending",
			"file-type",
		]

		separator = "│"
		mode.normal = "NOR"
		mode.insert = "INS"
		mode.select = "SEL"
		diagnostics = ["warning", "error"]
		workspace-diagnostics = ["warning", "error"]

	[editor.auto-pairs]
		'(' = ')'
		'{' = '}'
		'[' = ']'
		'"' = '"'
		'`' = '`'
		'<' = '>'

[keys.normal]
	# Print the current line's git blame information to the statusline.
	space.B = ":echo %sh{git blame -L %{cursor_line},+1 %{buffer_name}}"
	G = "goto_last_line"
	[keys.normal."z"]
		o = ":run-shell-command zed --existing %{buffer_name}"
		r = ":lsp-restart"
		R = ":config-reload"
		t = ":toggle lsp.enable"
